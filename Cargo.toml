[workspace]
resolver = "2"
members = [
    "crates/wt0",
]

[workspace.package]
version      = "0.1.13"
edition      = "2021"
# Floor set by edition-2024 dependencies in Cargo.lock; the msrv CI job
# enforces it, so bump both together.
rust-version = "1.85"
license      = "MIT"
authors      = ["Worktree Zero contributors"]
repository   = "https://github.com/lonormaly/worktree-zero"

[workspace.dependencies]
# Serialization
serde_json   = "1"

# CLI
clap         = { version = "4", features = ["derive", "env"] }

# UUIDs
uuid         = { version = "1", features = ["v4", "v7"] }

# Copy-on-write file cloning: APFS clonefile, Linux FICLONE reflink, and
# Windows ReFS block cloning behind one API.
reflink-copy = "0.1.30"

# Canonicalize without Windows verbatim (\\?\) prefixes, which Git for
# Windows cannot consume. A passthrough on Unix.
dunce        = "1"

# Error handling
anyhow       = "1"
