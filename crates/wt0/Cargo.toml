[package]
name        = "worktree-zero"
description = "One complete, thin development runtime for coding agents"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace  = true
homepage    = "https://github.com/lonormaly/worktree-zero"
readme      = "../../README.md"
keywords    = ["git", "worktree", "copy-on-write", "agents", "cli"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wt0"
path = "src/main.rs"

[dependencies]
clap.workspace         = true
serde_json.workspace   = true
anyhow.workspace       = true
uuid.workspace         = true
reflink-copy.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# cargo-binstall: fetch a prebuilt `wt0` from GitHub Releases instead of
# compiling. Expects release assets named wt0-<target>.tar.gz once published.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/wt0-{ target }{ archive-suffix }"
bin-dir = "wt0-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
