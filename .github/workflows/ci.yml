name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the run in flight; main runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck integration and benchmark scripts
        run: shellcheck tests/*.sh integrations/tilt/examples/*.sh npm/*.sh
      - name: Plugin manifest versions match the workspace version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq -e --arg v "$version" '.version == $v' "$manifest" >/dev/null \
              || { echo "$manifest version does not match workspace $version"; exit 1; }
          done
      - name: npm package.json versions stay at the build-time placeholder
        run: |
          # npm/build.sh stamps the real version (matching the workspace
          # version above) into every npm/*/package.json at build time, from
          # the version it's invoked with -- these files must not carry a
          # committed real version that could drift out of sync.
          placeholder="0.0.0-dev"
          jq -e --arg v "$placeholder" '.version == $v' npm/wt0/package.json >/dev/null \
            || { echo "npm/wt0/package.json version is not the $placeholder placeholder"; exit 1; }
          jq -e --arg v "$placeholder" \
            '.optionalDependencies | to_entries | all(.value == $v)' npm/wt0/package.json >/dev/null \
            || { echo "npm/wt0/package.json optionalDependencies are not all $placeholder"; exit 1; }
          for manifest in npm/platforms/*/package.json; do
            jq -e --arg v "$placeholder" '.version == $v' "$manifest" >/dev/null \
              || { echo "$manifest version is not the $placeholder placeholder"; exit 1; }
          done

  msrv:
    # The floor is set by edition-2024 dependencies in Cargo.lock; keep this in
    # sync with rust-version in Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'macOS'
        with:
          bun-version: 1.3.14
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Owned Cargo generated-runtime integration
        run: WT0_BIN="$PWD/target/debug/wt0" bash tests/generated_cargo_integration.sh
      - name: Owned Nx and Wrangler generated-runtime integration
        run: WT0_BIN="$PWD/target/debug/wt0" bash tests/generated_js_integration.sh
      - name: Prepared Bun environment integration
        if: runner.os == 'macOS'
        run: WT0="$PWD/target/debug/wt0" bash tests/prepared_bun_integration.sh
      - name: Bun without a global store falls back to a prepared environment
        if: runner.os == 'macOS'
        run: WT0="$PWD/target/debug/wt0" bash tests/prepared_bun_fallback_integration.sh
      - name: Install node_modules adapter fixtures
        if: runner.os == 'macOS'
        run: npm install --global pnpm@10.34.5 yarn@1.22.22
      - name: Prepared npm, pnpm, and Yarn environment integration
        if: runner.os == 'macOS'
        run: |
          WT0_BIN="$PWD/target/debug/wt0" bash tests/prepared_node_integration.sh npm
          WT0_BIN="$PWD/target/debug/wt0" bash tests/prepared_node_integration.sh pnpm
          WT0_BIN="$PWD/target/debug/wt0" bash tests/prepared_node_integration.sh yarn

  overlay-linux:
    # Validates the fuse-overlayfs populate mode, which cannot run on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fuse-overlayfs
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      - run: cargo build --release
      - name: Overlay integration test
        run: WT0="$PWD/target/release/wt0" bash tests/overlay_integration.sh

  reflink-linux:
    # ubuntu-latest runners use ext4, where clone_supported() is false and every
    # CoW code path silently early-returns. A loopback Btrfs volume makes the
    # Linux reflink path a tested claim instead of a macOS-only one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mount a loopback Btrfs volume
        run: |
          sudo apt-get update && sudo apt-get install -y btrfs-progs
          truncate -s 4G /tmp/wt0-btrfs.img
          mkfs.btrfs -q /tmp/wt0-btrfs.img
          sudo mkdir -p /mnt/wt0-btrfs
          sudo mount -o loop /tmp/wt0-btrfs.img /mnt/wt0-btrfs
          sudo chown "$USER" /mnt/wt0-btrfs
      - name: Unit and workflow tests on a reflink filesystem
        env:
          TMPDIR: /mnt/wt0-btrfs
        run: cargo test --all
      - name: Owned Cargo generated-runtime integration on reflink
        env:
          TMPDIR: /mnt/wt0-btrfs
        run: WT0_BIN="$PWD/target/debug/wt0" bash tests/generated_cargo_integration.sh
      - name: Prepared npm environment integration on reflink
        env:
          TMPDIR: /mnt/wt0-btrfs
        run: WT0_BIN="$PWD/target/debug/wt0" bash tests/prepared_node_integration.sh npm
      - name: Measure M1 (marginal storage per worktree) on Btrfs
        run: WT0="$PWD/target/debug/wt0" VOLUME=/mnt/wt0-btrfs N=5 bash tests/measure_m1.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and workflow tests (NTFS plain-fallback paths)
        run: cargo test --all
      - name: Create a ReFS volume
        shell: pwsh
        run: |
          $script = @"
          create vdisk file=C:\wt0-refs.vhdx maximum=6144 type=expandable
          attach vdisk
          create partition primary
          format fs=refs quick label=wt0
          assign letter=R
          "@
          Set-Content -Path diskpart.txt -Value $script
          diskpart /s diskpart.txt
          New-Item -ItemType Directory -Path R:\tmp | Out-Null
          Get-Volume -DriveLetter R
      - name: Tests on ReFS (block-clone CoW paths)
        env:
          TMP: R:\tmp
          TEMP: R:\tmp
        run: cargo test --all
      # Main only: wt0 create runs ~5 s per worktree on ReFS today (parallel
      # per-file clone; see "Gate 7" in flam-migration.md — down from ~20 s,
      # still short of native's ~1 s), so this step still adds real time to
      # every PR's critical path. Linux measures on every run.
      - name: Measure M1 (marginal storage per worktree) on ReFS
        if: github.event_name == 'push'
        shell: bash
        # Git Bash's `df` reaches the R: drive through an MSYS translation
        # layer we have not verified reports physical, clone-aware used
        # bytes for a diskpart-created ReFS volume, so WT0_M1_PS_DRIVE routes
        # tests/measure_m1.sh to `Get-PSDrive R | select Used` instead, which
        # asks Windows for the volume's real usage directly.
        env:
          WT0_M1_PS_DRIVE: R
        run: WT0="$PWD/target/debug/wt0.exe" VOLUME=/r/tmp N=5 bash tests/measure_m1.sh

  stress:
    # N agents arriving at once is the product's core scenario: many
    # simultaneous creates must yield disjoint slots, contended creates for
    # one runtime must resolve to a single owner, and simultaneous removes
    # must never corrupt the shared worktree registry.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 24-agent concurrency stress
        env:
          WT0_STRESS_AGENTS: "24"
        run: cargo test --test concurrency_stress -- --nocapture

  # Native ARM64 runner: no cross-linker to apt-install (that step alone took
  # 26 s on a good day and 577 s on a bad one — the whole run's critical path)
  # and the tests actually execute on the architecture.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked
