name: Release

# On every version tag, build `wt0` for the common targets and attach them to
# the GitHub release as wt0-<target>.tar.gz (containing wt0-<target>/wt0). This
# naming matches the [package.metadata.binstall] config in wt0/Cargo.toml, so
# `cargo binstall worktree-zero` fetches these prebuilt binaries instead of
# compiling.
#
# A manual run (workflow_dispatch) first tags the dispatched commit as
# v<workspace version> using the workflow's own token, then releases that tag
# — so a release can be cut end to end without local tag-push access. A tag
# pushed by the workflow token does not re-trigger this workflow, so a manual
# run never doubles up with the push trigger.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    # Resolve the release tag: the pushed tag, or (on manual runs) the
    # workspace version tagged at the dispatched commit, created if missing.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and create the version tag
        id: resolve
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; releasing it as-is"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Worktree Zero $version" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    # Create the release exactly once, before the build matrix fans out, so
    # six jobs never race `gh release create` against each other.
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "$tag" --generate-notes

  build:
    needs: [tag, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the exact commit the release tag names, on both trigger
          # paths (a pushed tag, or a pre-existing tag on a manual run).
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p worktree-zero
      - name: Package
        shell: bash
        run: |
          dir="wt0-${{ matrix.target }}"
          bin="wt0"
          case "${{ matrix.target }}" in *windows*) bin="wt0.exe" ;; esac
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/$bin" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          else
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          gh release upload "$tag" \
            "wt0-${{ matrix.target }}.tar.gz" \
            "wt0-${{ matrix.target }}.tar.gz.sha256" \
            --clobber

  # A release created with the workflow's own token does not fire the
  # `release: published` event for other workflows, and npm's Trusted
  # Publishing is bound to one workflow file per package (npm.yml). So the
  # last step dispatches Publish npm — workflow_dispatch is the documented
  # exception that GITHUB_TOKEN may trigger — instead of publishing here.
  npm:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Publish npm for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          gh workflow run npm.yml --repo "${{ github.repository }}" --ref main -f version="${tag#v}"
          echo "dispatched Publish npm for ${tag#v}"
